apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "subscription"
  namespace: "app-deploy"
  labels:
    app: "subscription"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "subscription"
  template:
    metadata:
      labels:
        app: "subscription"
    spec:
      containers:
      - name: "github-nateshr-likeminds-subscription-skulk-1"
        image: "asia.gcr.io/likeminds-nonprod-prj-24e1/github.com/nateshr/likeminds-subscription/skulk-beta:v3"
        resources:
          requests:
            memory: "1000Mi"
            cpu: "2000m"
          limits:
            memory: "3000Mi"
            cpu: "2500m"
  
---

apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "subscription"
  namespace: "app-deploy"
  labels:
    app: "subscription"
spec:
  scaleTargetRef:
    kind: "Deployment"
    name: "subscription"
    apiVersion: "apps/v1"
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: "Utilization"
        averageUtilization: 75
