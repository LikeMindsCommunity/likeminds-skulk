services:
  skulk_postgres:
    image: postgres:latest
    container_name: skulk_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skulk-local
    ports:
      - 5431:5432
    restart: unless-stopped
    networks:
      - likeminds-network
    volumes:
      - skulk_postgres_data:/var/lib/postgresql/data

  skulk_rabbitmq:
    image: rabbitmq:latest
    container_name: skulk_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - 5671:5672
      - 15671:15672
    networks:
      - likeminds-network

  skulk:
    container_name: skulk
    hostname: skulk
    build:
      dockerfile: ./Dockerfile.skulk-local
    ports:
      - 8081:8081
    environment:
      - BROKER_URL=amqp://guest:guest@skulk_rabbitmq:5672
      - DEVELOPMENT_DB_HOST=skulk_postgres
      - DEVELOPMENT_DB_NAME=skulk-local
      - DEVELOPMENT_DB_USER=postgres
      - DEVELOPMENT_DB_PASSWORD=postgres
      - DEVELOPMENT_CORE_URL=http://caravan:8000
      - DEVELOPMENT_KETTLE_URL=http://auth:8080
      - ELASTIC_SEARCH_HOST=caravan_elasticsearch
      - DEVELOPMENT_URL="http://skulk:8081"
      - DEVELOPMENT_WEB_URL=""
      - DEVELOPMENT_ALLOWED_HOST_1='*'
      - DEVELOPMENT_ALLOWED_HOST_2='skulk'
